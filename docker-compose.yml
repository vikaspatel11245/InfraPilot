version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: infrapilot-db
    environment:
      POSTGRES_DB: infrapilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - infrapilot-network

  redis:
    image: redis:7-alpine
    container_name: infrapilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - infrapilot-network

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: infrapilot-api
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/infrapilot
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    depends_on:
      - postgres
      - redis
    networks:
      - infrapilot-network

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: infrapilot-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - api
    networks:
      - infrapilot-network

  deployment-agent:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.agent
    container_name: infrapilot-agent
    environment:
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/infrapilot
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - infrapilot-network

volumes:
  pgdata:
  redisdata:

networks:
  infrapilot-network:
    driver: bridge
